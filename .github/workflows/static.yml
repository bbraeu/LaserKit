# Test the site, then build it and deploy it to GitHub Pages.
#
# The gate is the point: the tests run *before* anything is published, and a
# red one stops the deploy. Everything this site does happens in the visitor's
# browser, so "it builds" says almost nothing about whether it works — the
# end-to-end suite driving a real Chromium is the only thing that does.
#
# Three jobs rather than one, deliberately. A single-job workflow that is re-run
# after a failure uploads a second `github-pages` artifact and dies with
# "Multiple artifacts named github-pages were unexpectedly found"; split, a
# re-run of the failed job does the right thing. And a release must only exist
# for something that actually went live, which is what `needs: deploy` says.
name: Test, deploy and release

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check
      - name: Unit tests
        run: pnpm run test

      # Chromium only — the suite pins one browser in playwright.config.ts, and
      # pulling the other two would triple the slowest step in the workflow.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm run test:e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Built again rather than reusing the copy `test:e2e` left behind: what
      # gets published should not depend on a side effect of a test step.
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable GitHub Pages (source: GitHub Actions) on first run
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      # The same build again as a plain artifact, so the release job can attach
      # it without installing and building the site a second time.
      - name: Keep the build for the release
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, because the version is worked out from the existing tags.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # What went live gets a version, always — a deploy nobody can name is a
      # deploy nobody can roll back to.
      #
      # package.json is the floor, not the answer: raise it there and that is
      # the version (a deliberate major or minor), leave it alone and the patch
      # ticks up from the newest tag. So a routine copy fix becomes 3.0.1
      # without ceremony, and 3.1.0 still means someone decided it did.
      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            NEXT="$PKG"
          elif [ "$PKG" != "$LATEST" ] && [ "$(printf '%s\n%s\n' "$PKG" "$LATEST" | sort -V | tail -1)" = "$PKG" ]; then
            NEXT="$PKG"
          else
            NEXT=$(echo "$LATEST" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "package.json $PKG, newest tag ${LATEST:-none} -> v$NEXT"

          # `--generate-notes` alone writes little more than a compare link in a
          # repo with no pull requests, so the commit subjects since the last
          # tag go in ahead of it. That is what the history actually is here.
          {
            echo 'notes<<RELEASE_NOTES'
            if [ -n "$LATEST" ]; then
              git log --reverse --pretty='- %s' "v$LATEST..HEAD"
            else
              git log --reverse --pretty='- %s'
            fi
            echo
            echo 'RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Zip it
        run: cd site && zip -qr "../laserkit-${{ steps.v.outputs.tag }}.zip" .

      # `gh release create` tags the commit itself, so there is no tag push to
      # race the workflow with. Tag pushes do not re-trigger this workflow
      # anyway — it only listens to `main` — but one moving part fewer.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }} — ${{ steps.v.outputs.subject }}" \
            --notes "${{ steps.v.outputs.notes }}" \
            --generate-notes \
            --latest \
            "laserkit-${{ steps.v.outputs.tag }}.zip#The built site, for running it offline"
